spring:
  config:
    import: optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: dev
      config:
        server-addr: nacos:8848
        namespace: dev
        file-extension: yaml
        # 声明共享配置列表
        shared-configs:
          - data-id: common-redis.yaml
            group: DEFAULT_GROUP
            refresh: true
