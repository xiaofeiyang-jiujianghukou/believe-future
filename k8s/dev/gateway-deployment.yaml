# believe-gateway 开发环境部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: believe-gateway
  namespace: believe-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: believe-gateway
  template:
    metadata:
      labels:
        app: believe-gateway
    spec:
      containers:
        - name: gateway
          image: registry.believe.com/believe/believe-gateway:latest
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: NACOS_HOST
              value: "nacos.believe-dev.svc.cluster.local"
            - name: NACOS_NAMESPACE
              value: "dev"
---
apiVersion: v1
kind: Service
metadata:
  name: believe-gateway
  namespace: believe-dev
spec:
  selector:
    app: believe-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: management
      port: 8081
      targetPort: 8081
  type: ClusterIP
