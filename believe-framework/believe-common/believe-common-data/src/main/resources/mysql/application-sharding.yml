believe:
  data:
    read-write-split:
      enabled: false
    multi-datasource:
      enabled: false
    sharding:
      enabled: true
      config-location: classpath:sharding/sharding-config.yaml
      show-sql: true

# 分库分表模式下，使用 ShardingSphereDriver
spring:
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding/sharding-config.yaml

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl